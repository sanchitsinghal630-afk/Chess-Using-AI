<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Grandmaster Arena - Offline Chess</title>
  <style>
    :root {
      --bg-main: #181714;
      --bg-panel: #262421;
      --bg-panel-alt: #21201d;
      --border-subtle: #363431;
      --text-main: #f0f0f0;
      --text-muted: #8b8987;
      --accent-green: #81b64c;
      --accent-green-hover: #96c85e;
      --sq-light: #eeeed2;
      --sq-dark: #769656;
      --highlight-light: #f7f769;
      --highlight-dark: #baca2b;
      --selected-light: #f5f682;
      --selected-dark: #b9ca43;
      --check-glow: rgba(235, 64, 52, 0.85);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }
    #app-container {
      width: 100%;
      max-width: 1180px;
      height: 100vh;
      display: flex;
      flex-direction: row;
      gap: 16px;
      padding: 12px;
    }
    @media (max-width: 900px) {
      #app-container {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        padding: 8px;
        align-items: center;
      }
    }

    /* Left: Board Section */
    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      max-width: 680px;
      width: 100%;
    }
    .player-banner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .player-avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      font-size: 16px;
    }
    .player-meta {
      display: flex;
      flex-direction: column;
    }
    .player-name {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .turn-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-green);
      color: #fff;
      display: none;
    }
    .turn-pill.active {
      display: inline-block;
    }
    .captured-tray {
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 18px;
    }
    .captured-icon {
      width: 16px;
      height: 16px;
    }
    .material-adv {
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      margin-left: 6px;
    }

    /* Chessboard Frame */
    .board-wrapper {
      position: relative;
      width: min(88vw, 560px);
      height: min(88vw, 560px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      overflow: hidden;
      touch-action: none;
    }
    #chessboard {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      position: relative;
      background: var(--sq-dark);
    }
    .square {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .square.light {
      background-color: var(--sq-light);
    }
    .square.dark {
      background-color: var(--sq-dark);
    }
    .square.highlight-light {
      background-color: var(--highlight-light) !important;
    }
    .square.highlight-dark {
      background-color: var(--highlight-dark) !important;
    }
    .square.selected-light {
      background-color: var(--selected-light) !important;
    }
    .square.selected-dark {
      background-color: var(--selected-dark) !important;
    }
    .square.in-check {
      background: radial-gradient(ellipse at center, var(--check-glow) 0%, rgba(235, 64, 52, 0) 75%) !important;
    }

    /* Coordinates */
    .coord {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      line-height: 1;
      z-index: 1;
    }
    .coord-rank {
      top: 3px;
      left: 3px;
    }
    .coord-file {
      bottom: 3px;
      right: 3px;
    }
    .square.light .coord {
      color: #769656;
    }
    .square.dark .coord {
      color: #eeeed2;
    }

    /* Move Hint Indicators */
    .hint-dot {
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.28);
      pointer-events: none;
      z-index: 5;
    }
    .hint-capture {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 6px solid rgba(0, 0, 0, 0.25);
      pointer-events: none;
      z-index: 5;
    }

    /* Piece Rendering */
    .piece-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 3;
    }
    .piece-svg {
      width: 86%;
      height: 86%;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.35));
    }
    .captured-icon .piece-svg {
      width: 100%;
      height: 100%;
      filter: none;
    }
    .dragging-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
    }

    /* Right: Control & Notation Sidebar */
    .sidebar {
      width: 100%;
      max-width: 440px;
      background: var(--bg-panel);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
    }
    @media (max-width: 900px) {
      .sidebar {
        max-width: 560px;
        min-height: 380px;
        margin-bottom: 24px;
      }
    }
    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-panel-alt);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: #334155;
      color: #94a3b8;
    }
    .status-badge.check {
      background: #7f1d1d;
      color: #fca5a5;
    }
    .status-badge.gameover {
      background: #854d0e;
      color: #fef08a;
    }

    /* Config Bar */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg-panel-alt);
      border-bottom: 1px solid var(--border-subtle);
    }
    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ctrl-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
    }
    .ctrl-select {
      background: #181714;
      color: #f0f0f0;
      border: 1px solid var(--border-subtle);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Notation Log */
    .moves-container {
      flex: 1;
      min-height: 180px;
      max-height: 380px;
      overflow-y: auto;
      padding: 10px 14px;
      background: var(--bg-panel);
    }
    .moves-container::-webkit-scrollbar {
      width: 6px;
    }
    .moves-container::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 3px;
    }
    .move-row {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-family: monospace;
    }
    .move-row:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }
    .move-num {
      width: 36px;
      color: var(--text-muted);
      font-weight: bold;
    }
    .move-col {
      flex: 1;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .move-col.active {
      background: rgba(129, 182, 76, 0.3);
      color: #a3e635;
    }

    /* Action Buttons */
    .actions-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-panel-alt);
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #363431;
      color: var(--text-main);
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn:hover {
      background: #464440;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn.primary {
      background: var(--accent-green);
      color: #fff;
    }
    .btn.primary:hover {
      background: var(--accent-green-hover);
    }

    /* Modal (Promotion & Game Over) */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.hidden {
      display: none !important;
    }
    .modal-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      max-width: 320px;
      width: 100%;
    }
    .promo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .promo-option {
      background: var(--sq-dark);
      border-radius: 8px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
    }
    .promo-option:hover {
      border-color: #fff;
      background: var(--sq-light);
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Left Side: Interactive Board -->
  <div class="game-area">
    <!-- Top Player (Black or Bot) -->
    <div class="player-banner" id="banner-black">
      <div class="player-info">
        <div class="player-avatar" id="avatar-black">🤖</div>
        <div class="player-meta">
          <div class="player-name">
            <span id="name-black">StockBot</span>
            <span class="turn-pill" id="pill-black">TURN</span>
          </div>
          <div class="captured-tray" id="tray-black">
            <!-- Captured white pieces go here -->
          </div>
        </div>
      </div>
      <div class="material-adv" id="adv-black"></div>
    </div>

    <!-- The 8x8 Chessboard Container -->
    <div class="board-wrapper">
      <div id="chessboard"></div>

      <!-- Promotion Modal inside board -->
      <div id="modal-promotion" class="modal-overlay hidden">
        <div class="modal-card">
          <h3 style="font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:1px;">Promote Pawn</h3>
          <div class="promo-grid" id="promo-options">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Player (White or Local Player) -->
    <div class="player-banner" id="banner-white">
      <div class="player-info">
        <div class="player-avatar" id="avatar-white">👤</div>
        <div class="player-meta">
          <div class="player-name">
            <span id="name-white">Player (White)</span>
            <span class="turn-pill active" id="pill-white">TURN</span>
          </div>
          <div class="captured-tray" id="tray-white">
            <!-- Captured black pieces go here -->
          </div>
        </div>
      </div>
      <div class="material-adv" id="adv-white"></div>
    </div>
  </div>

  <!-- Right Side: Move History & Controls -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="game-title">
        <span style="font-size: 20px;">♟️</span>
        <span>Grandmaster Arena</span>
      </div>
      <div class="status-badge" id="status-badge">WHITE TO MOVE</div>
    </div>

    <!-- Settings bar -->
    <div class="controls-grid">
      <div class="ctrl-group">
        <label class="ctrl-label">Mode</label>
        <select class="ctrl-select" id="mode-select">
          <option value="ai">Play vs Computer</option>
          <option value="pass">Pass and Play (Local)</option>
        </select>
      </div>
      <div class="ctrl-group">
        <label class="ctrl-label">Bot Level</label>
        <select class="ctrl-select" id="difficulty-select">
          <option value="easy">Easy (Casual)</option>
          <option value="medium" selected>Medium (Club)</option>
          <option value="hard">Hard (Master)</option>
        </select>
      </div>
    </div>

    <!-- Move List / SAN Log -->
    <div class="moves-container" id="moves-log">
      <!-- Generated Move Pairs -->
    </div>

    <!-- Action Buttons -->
    <div class="actions-bar">
      <button class="btn primary" id="btn-new-game">New Game</button>
      <button class="btn" id="btn-undo">Undo</button>
      <button class="btn" id="btn-flip">Flip</button>
      <button class="btn" id="btn-sound">🔊</button>
    </div>
  </div>
</div>

<!-- Drag Ghost Element -->
<div id="drag-ghost" class="dragging-ghost" style="display:none;"></div>

// --- WEB AUDIO SYNTHESIZER ---
class ChessSound {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }
  ensureInit() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playMove() {
    if (this.muted) return;
    this.ensureInit();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(360, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.1);
  }
  playCapture() {
    if (this.muted) return;
    this.ensureInit();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(520, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.13);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.14);
  }
  playCheck() {
    if (this.muted) return;
    this.ensureInit();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, this.ctx.currentTime);
    osc.frequency.setValueAtTime(1174, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.36);
  }
  playEnd() {
    if (this.muted) return;
    this.ensureInit();
    if (!this.ctx) return;
    [440, 554, 659, 880].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
      g.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.09);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.09 + 0.25);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.09);
      osc.stop(this.ctx.currentTime + idx * 0.09 + 0.26);
    });
  }
}

// --- PURE JAVASCRIPT CHESS ENGINE ---
class ChessEngine {
  constructor() {
    this.reset();
  }

  reset() {
    // 8x8 Board representation: row 0 = rank 8 (Black side), row 7 = rank 1 (White side)
    this.board = [
      ['bR','bN','bB','bQ','bK','bB','bN','bR'],
      ['bP','bP','bP','bP','bP','bP','bP','bP'],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      ['wP','wP','wP','wP','wP','wP','wP','wP'],
      ['wR','wN','wB','wQ','wK','wB','wN','wR']
    ];
    this.turn = 'w'; // 'w' | 'b'
    this.castling = { wK: true, wQ: true, bK: true, bQ: true };
    this.enPassant = null; // {r, c} or null
    this.halfMoveClock = 0;
    this.fullMoveNumber = 1;
    this.history = []; // snapshots for undo
  }

  cloneState() {
    return {
      board: this.board.map(r => [...r]),
      turn: this.turn,
      castling: { ...this.castling },
      enPassant: this.enPassant ? { ...this.enPassant } : null,
      halfMoveClock: this.halfMoveClock,
      fullMoveNumber: this.fullMoveNumber
    };
  }

  getPiece(r, c) {
    if (r < 0 || r > 7 || c < 0 || c > 7) return null;
    return this.board[r][c];
  }

  isPieceColor(r, c, color) {
    const p = this.getPiece(r, c);
    return p !== null && p[0] === color;
  }

  // Find King
  findKing(color) {
    const target = color + 'K';
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        if (this.board[r][c] === target) return { r, c };
      }
    }
    return null;
  }

  // Check if square is attacked by opponent
  isSquareAttacked(r, c, attackerColor) {
    // 1. Pawn attacks
    const pawnRow = attackerColor === 'w' ? r + 1 : r - 1;
    if (pawnRow >= 0 && pawnRow < 8) {
      if (c - 1 >= 0 && this.board[pawnRow][c - 1] === attackerColor + 'P') return true;
      if (c + 1 < 8 && this.board[pawnRow][c + 1] === attackerColor + 'P') return true;
    }

    // 2. Knight attacks
    const kOffsets = [
      [-2, -1], [-2, 1], [-1, -2], [-1, 2],
      [1, -2], [1, 2], [2, -1], [2, 1]
    ];
    for (let [dr, dc] of kOffsets) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
        if (this.board[nr][nc] === attackerColor + 'N') return true;
      }
    }

    // 3. Sliding orthogonals (Rook, Queen)
    const ortho = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (let [dr, dc] of ortho) {
      let nr = r + dr, nc = c + dc;
      while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
        const p = this.board[nr][nc];
        if (p) {
          if (p[0] === attackerColor && (p[1] === 'R' || p[1] === 'Q')) return true;
          break;
        }
        nr += dr; nc += dc;
      }
    }

    // 4. Sliding diagonals (Bishop, Queen)
    const diag = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
    for (let [dr, dc] of diag) {
      let nr = r + dr, nc = c + dc;
      while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
        const p = this.board[nr][nc];
        if (p) {
          if (p[0] === attackerColor && (p[1] === 'B' || p[1] === 'Q')) return true;
          break;
        }
        nr += dr; nc += dc;
      }
    }

    // 5. King proximity
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
          if (this.board[nr][nc] === attackerColor + 'K') return true;
        }
      }
    }

    return false;
  }

  isInCheck(color = this.turn) {
    const king = this.findKing(color);
    if (!king) return false;
    const opponent = color === 'w' ? 'b' : 'w';
    return this.isSquareAttacked(king.r, king.c, opponent);
  }

  // Generate pseudo-legal moves
  getPseudoMoves(color = this.turn) {
    const moves = [];
    const opp = color === 'w' ? 'b' : 'w';
    const pawnDir = color === 'w' ? -1 : 1;
    const startPawnRow = color === 'w' ? 6 : 1;
    const promoRow = color === 'w' ? 0 : 7;

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const piece = this.board[r][c];
        if (!piece || piece[0] !== color) continue;
        const type = piece[1];

        if (type === 'P') {
          // One square forward
          const forwardR = r + pawnDir;
          if (forwardR >= 0 && forwardR < 8 && !this.board[forwardR][c]) {
            if (forwardR === promoRow) {
              ['Q', 'R', 'B', 'N'].forEach(pr => {
                moves.push({ from: { r, c }, to: { r: forwardR, c }, promo: pr });
              });
            } else {
              moves.push({ from: { r, c }, to: { r: forwardR, c } });
              // Two squares forward from initial row
              const doubleR = r + 2 * pawnDir;
              if (r === startPawnRow && !this.board[doubleR][c]) {
                moves.push({ from: { r, c }, to: { r: doubleR, c }, isDoublePawn: true });
              }
            }
          }
          // Diagonal captures
          for (let dc of [-1, 1]) {
            const capC = c + dc;
            if (capC >= 0 && capC < 8) {
              const capR = r + pawnDir;
              // Standard piece capture
              if (this.isPieceColor(capR, capC, opp)) {
                if (capR === promoRow) {
                  ['Q', 'R', 'B', 'N'].forEach(pr => {
                    moves.push({ from: { r, c }, to: { r: capR, c: capC }, promo: pr });
                  });
                } else {
                  moves.push({ from: { r, c }, to: { r: capR, c: capC } });
                }
              }
              // En Passant capture
              if (this.enPassant && this.enPassant.r === capR && this.enPassant.c === capC) {
                moves.push({ from: { r, c }, to: { r: capR, c: capC }, isEnPassant: true });
              }
            }
          }
        } else if (type === 'N') {
          const jumps = [
            [-2, -1], [-2, 1], [-1, -2], [-1, 2],
            [1, -2], [1, 2], [2, -1], [2, 1]
          ];
          for (let [dr, dc] of jumps) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
              if (!this.board[nr][nc] || this.board[nr][nc][0] === opp) {
                moves.push({ from: { r, c }, to: { r: nr, c: nc } });
              }
            }
          }
        } else if (type === 'B' || type === 'R' || type === 'Q') {
          const dirs = [];
          if (type === 'B' || type === 'Q') dirs.push([-1, -1], [-1, 1], [1, -1], [1, 1]);
          if (type === 'R' || type === 'Q') dirs.push([-1, 0], [1, 0], [0, -1], [0, 1]);

          for (let [dr, dc] of dirs) {
            let nr = r + dr, nc = c + dc;
            while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
              const p = this.board[nr][nc];
              if (!p) {
                moves.push({ from: { r, c }, to: { r: nr, c: nc } });
              } else {
                if (p[0] === opp) moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                break;
              }
              nr += dr; nc += dc;
            }
          }
        } else if (type === 'K') {
          // Standard 1-square movement
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                if (!this.board[nr][nc] || this.board[nr][nc][0] === opp) {
                  moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                }
              }
            }
          }

          // Castling Moves (King cannot be in check)
          if (!this.isInCheck(color)) {
            const kRow = color === 'w' ? 7 : 0;
            if (r === kRow && c === 4) {
              // Kingside (O-O)
              if (this.castling[color + 'K']) {
                if (!this.board[kRow][5] && !this.board[kRow][6]) {
                  if (!this.isSquareAttacked(kRow, 5, opp) && !this.isSquareAttacked(kRow, 6, opp)) {
                    moves.push({ from: { r, c }, to: { r: kRow, c: 6 }, isCastle: 'K' });
                  }
                }
              }
              // Queenside (O-O-O)
              if (this.castling[color + 'Q']) {
                if (!this.board[kRow][1] && !this.board[kRow][2] && !this.board[kRow][3]) {
                  if (!this.isSquareAttacked(kRow, 3, opp) && !this.isSquareAttacked(kRow, 2, opp)) {
                    moves.push({ from: { r, c }, to: { r: kRow, c: 2 }, isCastle: 'Q' });
                  }
                }
              }
            }
          }
        }
      }
    }
    return moves;
  }

  // Make move without safety checks (internal)
  makeMoveInternal(move) {
    const fromP = this.board[move.from.r][move.from.c];
    const toP = this.board[move.to.r][move.to.c];
    const color = fromP[0];
    const type = fromP[1];

    // Standard piece move
    this.board[move.to.r][move.to.c] = fromP;
    this.board[move.from.r][move.from.c] = null;

    // Pawn Promotion
    if (move.promo) {
      this.board[move.to.r][move.to.c] = color + move.promo;
    }

    // En Passant Capture
    let epCaptured = null;
    if (move.isEnPassant) {
      const capRow = color === 'w' ? move.to.r + 1 : move.to.r - 1;
      epCaptured = this.board[capRow][move.to.c];
      this.board[capRow][move.to.c] = null;
    }

    // Castling Rook Transfer
    if (move.isCastle === 'K') {
      this.board[move.to.r][5] = color + 'R';
      this.board[move.to.r][7] = null;
    } else if (move.isCastle === 'Q') {
      this.board[move.to.r][3] = color + 'R';
      this.board[move.to.r][0] = null;
    }

    // Set new En Passant square
    if (move.isDoublePawn) {
      this.enPassant = { r: (move.from.r + move.to.r) / 2, c: move.from.c };
    } else {
      this.enPassant = null;
    }

    // Castling rights forfeiture
    if (type === 'K') {
      this.castling[color + 'K'] = false;
      this.castling[color + 'Q'] = false;
    }
    if (type === 'R') {
      if (move.from.r === 7 && move.from.c === 7) this.castling.wK = false;
      if (move.from.r === 7 && move.from.c === 0) this.castling.wQ = false;
      if (move.from.r === 0 && move.from.c === 7) this.castling.bK = false;
      if (move.from.r === 0 && move.from.c === 0) this.castling.bQ = false;
    }
    // If a rook is captured in corner
    if (toP && toP[1] === 'R') {
      if (move.to.r === 7 && move.to.c === 7) this.castling.wK = false;
      if (move.to.r === 7 && move.to.c === 0) this.castling.wQ = false;
      if (move.to.r === 0 && move.to.c === 7) this.castling.bK = false;
      if (move.to.r === 0 && move.to.c === 0) this.castling.bQ = false;
    }

    return { captured: epCaptured || toP };
  }

  // Legal moves generator: filter out moves leaving own King in check
  getLegalMoves(color = this.turn) {
    const pseudo = this.getPseudoMoves(color);
    const legal = [];

    for (let m of pseudo) {
      const snap = this.cloneState();
      this.makeMoveInternal(m);
      if (!this.isInCheck(color)) {
        legal.push(m);
      }
      // Revert
      this.board = snap.board;
      this.turn = snap.turn;
      this.castling = snap.castling;
      this.enPassant = snap.enPassant;
      this.halfMoveClock = snap.halfMoveClock;
      this.fullMoveNumber = snap.fullMoveNumber;
    }
    return legal;
  }

  // Commit a legal move
  makeMove(move) {
    // Generate SAN notation before mutating state
    const san = this.moveToSAN(move);

    const snapshot = this.cloneState();
    const result = this.makeMoveInternal(move);

    this.turn = this.turn === 'w' ? 'b' : 'w';
    if (this.turn === 'w') this.fullMoveNumber++;

    const isCheck = this.isInCheck(this.turn);
    const hasLegal = this.getLegalMoves(this.turn).length > 0;
    const isCheckmate = isCheck && !hasLegal;
    const isStalemate = !isCheck && !hasLegal;

    // Append SAN check / checkmate sign
    let finalSAN = san;
    if (isCheckmate) finalSAN += '#';
    else if (isCheck) finalSAN += '+';

    this.history.push({
      move,
      san: finalSAN,
      captured: result.captured,
      stateBefore: snapshot
    });

    return {
      san: finalSAN,
      captured: result.captured,
      isCheck,
      isCheckmate,
      isStalemate
    };
  }

  undo() {
    if (this.history.length === 0) return null;
    const last = this.history.pop();
    const s = last.stateBefore;
    this.board = s.board;
    this.turn = s.turn;
    this.castling = s.castling;
    this.enPassant = s.enPassant;
    this.halfMoveClock = s.halfMoveClock;
    this.fullMoveNumber = s.fullMoveNumber;
    return last;
  }

  // Standard Algebraic Notation (SAN) Converter
  moveToSAN(move) {
    if (move.isCastle === 'K') return 'O-O';
    if (move.isCastle === 'Q') return 'O-O-O';

    const p = this.board[move.from.r][move.from.c];
    const type = p[1];
    const files = 'abcdefgh';
    const ranks = '87654321';
    const dest = files[move.to.c] + ranks[move.to.r];
    const isCapture = !!this.board[move.to.r][move.to.c] || move.isEnPassant;

    if (type === 'P') {
      let str = '';
      if (isCapture) {
        str += files[move.from.c] + 'x' + dest;
      } else {
        str += dest;
      }
      if (move.promo) {
        str += '=' + move.promo;
      }
      return str;
    }

    // Pieces: Disambiguation if needed
    let disambig = '';
    const legalSameType = this.getLegalMoves(p[0]).filter(m => 
      m.to.r === move.to.r && m.to.c === move.to.c &&
      this.board[m.from.r][m.from.c] === p &&
      (m.from.r !== move.from.r || m.from.c !== move.from.c)
    );

    if (legalSameType.length > 0) {
      const sameFile = legalSameType.some(m => m.from.c === move.from.c);
      const sameRank = legalSameType.some(m => m.from.r === move.from.r);
      if (!sameFile) disambig += files[move.from.c];
      else if (!sameRank) disambig += ranks[move.from.r];
      else disambig += files[move.from.c] + ranks[move.from.r];
    }

    return type + disambig + (isCapture ? 'x' : '') + dest;
  }
}

// --- PIECE-SQUARE TABLES & MINIMAX BOT ---
const PST = {
  P: [
    [0,  0,  0,  0,  0,  0,  0,  0],
    [50, 50, 50, 50, 50, 50, 50, 50],
    [10, 10, 20, 30, 30, 20, 10, 10],
    [5,  5, 10, 25, 25, 10,  5,  5],
    [0,  0,  0, 20, 20,  0,  0,  0],
    [5, -5,-10,  0,  0,-10, -5,  5],
    [5, 10, 10,-20,-20, 10, 10,  5],
    [0,  0,  0,  0,  0,  0,  0,  0]
  ],
  N: [
    [-50,-40,-30,-30,-30,-30,-40,-50],
    [-40,-20,  0,  0,  0,  0,-20,-40],
    [-30,  0, 10, 15, 15, 10,  0,-30],
    [-30,  5, 15, 20, 20, 15,  5,-30],
    [-30,  0, 15, 20, 20, 15,  0,-30],
    [-30,  5, 10, 15, 15, 10,  5,-30],
    [-40,-20,  0,  5,  5,  0,-20,-40],
    [-50,-40,-30,-30,-30,-30,-40,-50]
  ],
  B: [
    [-20,-10,-10,-10,-10,-10,-10,-20],
    [-10,  0,  0,  0,  0,  0,  0,-10],
    [-10,  0,  5, 10, 10,  5,  0,-10],
    [-10,  5,  5, 10, 10,  5,  5,-10],
    [-10,  0, 10, 10, 10, 10,  0,-10],
    [-10, 10, 10, 10, 10, 10, 10,-10],
    [-10,  5,  0,  0,  0,  0,  5,-10],
    [-20,-10,-10,-10,-10,-10,-10,-20]
  ],
  R: [
    [0,  0,  0,  0,  0,  0,  0,  0],
    [5, 10, 10, 10, 10, 10, 10,  5],
    [-5,  0,  0,  0,  0,  0,  0, -5],
    [-5,  0,  0,  0,  0,  0,  0, -5],
    [-5,  0,  0,  0,  0,  0,  0, -5],
    [-5,  0,  0,  0,  0,  0,  0, -5],
    [-5,  0,  0,  0,  0,  0,  0, -5],
    [0,  0,  0,  5,  5,  0,  0,  0]
  ],
  Q: [
    [-20,-10,-10, -5, -5,-10,-10,-20],
    [-10,  0,  0,  0,  0,  0,  0,-10],
    [-10,  0,  5,  5,  5,  5,  0,-10],
    [-5,  0,  5,  5,  5,  5,  0, -5],
    [0,  0,  5,  5,  5,  5,  0, -5],
    [-10,  5,  5,  5,  5,  5,  0,-10],
    [-10,  0,  5,  0,  0,  0,  0,-10],
    [-20,-10,-10, -5, -5,-10,-10,-20]
  ],
  K: [
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-20,-30,-30,-40,-40,-30,-30,-20],
    [-10,-20,-20,-20,-20,-20,-20,-10],
    [20, 20,  0,  0,  0,  0, 20, 20],
    [20, 30, 10,  0,  0, 10, 30, 20]
  ]
};

const BASE_WEIGHTS = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000 };

function evaluateBoard(engine) {
  let score = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = engine.board[r][c];
      if (!p) continue;
      const color = p[0];
      const type = p[1];
      const val = BASE_WEIGHTS[type];
      const table = PST[type];
      const pstVal = color === 'w' ? table[r][c] : table[7 - r][c];
      const total = val + pstVal;
      score += (color === 'w' ? total : -total);
    }
  }
  return score;
}

// Alpha-Beta Minimax
function minimax(engine, depth, alpha, beta, isMaximizing) {
  if (depth === 0) return evaluateBoard(engine);

  const legal = engine.getLegalMoves(isMaximizing ? 'w' : 'b');
  if (legal.length === 0) {
    if (engine.isInCheck(isMaximizing ? 'w' : 'b')) {
      return isMaximizing ? -99999 + (4 - depth) : 99999 - (4 - depth);
    }
    return 0; // Stalemate
  }

  // Move ordering: evaluate captures first for quick cutoffs
  legal.sort((a, b) => {
    const capA = engine.board[a.to.r][a.to.c] ? 10 : 0;
    const capB = engine.board[b.to.r][b.to.c] ? 10 : 0;
    return capB - capA;
  });

  if (isMaximizing) {
    let maxEval = -Infinity;
    for (let m of legal) {
      const snap = engine.cloneState();
      engine.makeMoveInternal(m);
      const evalScore = minimax(engine, depth - 1, alpha, beta, false);
      engine.board = snap.board;
      engine.turn = snap.turn;
      engine.castling = snap.castling;
      engine.enPassant = snap.enPassant;
      engine.halfMoveClock = snap.halfMoveClock;
      engine.fullMoveNumber = snap.fullMoveNumber;

      maxEval = Math.max(maxEval, evalScore);
      alpha = Math.max(alpha, evalScore);
      if (beta <= alpha) break;
    }
    return maxEval;
  } else {
    let minEval = Infinity;
    for (let m of legal) {
      const snap = engine.cloneState();
      engine.makeMoveInternal(m);
      const evalScore = minimax(engine, depth - 1, alpha, beta, true);
      engine.board = snap.board;
      engine.turn = snap.turn;
      engine.castling = snap.castling;
      engine.enPassant = snap.enPassant;
      engine.halfMoveClock = snap.halfMoveClock;
      engine.fullMoveNumber = snap.fullMoveNumber;

      minEval = Math.min(minEval, evalScore);
      beta = Math.min(beta, evalScore);
      if (beta <= alpha) break;
    }
    return minEval;
  }
}

function findBestMove(engine, difficulty = 'medium') {
  const legal = engine.getLegalMoves('b');
  if (legal.length === 0) return null;

  // Easy: Mostly random or shallow greedy
  if (difficulty === 'easy') {
    if (Math.random() < 0.5) {
      return legal[Math.floor(Math.random() * legal.length)];
    }
  }

  const depth = difficulty === 'hard' ? 3 : (difficulty === 'medium' ? 2 : 1);
  let bestMove = legal[0];
  let minScore = Infinity;

  for (let m of legal) {
    const snap = engine.cloneState();
    engine.makeMoveInternal(m);
    const score = minimax(engine, depth - 1, -Infinity, Infinity, true);
    engine.board = snap.board;
    engine.turn = snap.turn;
    engine.castling = snap.castling;
    engine.enPassant = snap.enPassant;
    engine.halfMoveClock = snap.halfMoveClock;
    engine.fullMoveNumber = snap.fullMoveNumber;

    if (score < minScore) {
      minScore = score;
      bestMove = m;
    }
  }
  return bestMove;
}

// --- UI CONTROLLER & GAME STATE ---
const engine = new ChessEngine();

const state = {
  flipped: false,
  mode: 'ai', // 'ai' | 'pass'
  difficulty: 'medium',
  selectedSquare: null,
  availableMoves: [],
  lastMove: null,
  pendingPromotion: null,
  isGameOver: false,
  isThinking: false
};

// DOM Cache
const boardEl = document.getElementById('chessboard');
const movesLogEl = document.getElementById('moves-log');
const statusBadge = document.getElementById('status-badge');
const promoModal = document.getElementById('modal-promotion');
const promoGrid = document.getElementById('promo-options');
const dragGhost = document.getElementById('drag-ghost');

// Initialize Board Squares
function buildBoardGrid() {
  boardEl.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement('div');
      sq.className = 'square';
      sq.dataset.row = r;
      sq.dataset.col = c;
      boardEl.appendChild(sq);
    }
  }
}

// Render Board & Pieces
function renderBoard() {
  const squares = boardEl.querySelectorAll('.square');
  const kingInCheck = engine.isInCheck(engine.turn) ? engine.findKing(engine.turn) : null;

  squares.forEach(sq => {
    let r = parseInt(sq.dataset.row);
    let c = parseInt(sq.dataset.col);

    // Apply flip view
    const displayR = state.flipped ? 7 - r : r;
    const displayC = state.flipped ? 7 - c : c;

    sq.dataset.boardRow = displayR;
    sq.dataset.boardCol = displayC;

    const isLight = (displayR + displayC) % 2 === 0;
    sq.className = `square ${isLight ? 'light' : 'dark'}`;
    sq.innerHTML = '';

    // Last Move Highlights
    if (state.lastMove) {
      if ((state.lastMove.from.r === displayR && state.lastMove.from.c === displayC) ||
          (state.lastMove.to.r === displayR && state.lastMove.to.c === displayC)) {
        sq.classList.add(isLight ? 'highlight-light' : 'highlight-dark');
      }
    }

    // Selected Square
    if (state.selectedSquare && state.selectedSquare.r === displayR && state.selectedSquare.c === displayC) {
      sq.classList.add(isLight ? 'selected-light' : 'selected-dark');
    }

    // Check Glowing King
    if (kingInCheck && kingInCheck.r === displayR && kingInCheck.c === displayC) {
      sq.classList.add('in-check');
    }

    // Board Edge Coordinates
    if (c === 0) {
      const rankLbl = document.createElement('div');
      rankLbl.className = 'coord coord-rank';
      rankLbl.textContent = 8 - displayR;
      sq.appendChild(rankLbl);
    }
    if (r === 7) {
      const fileLbl = document.createElement('div');
      fileLbl.className = 'coord coord-file';
      fileLbl.textContent = 'abcdefgh'[displayC];
      sq.appendChild(fileLbl);
    }

    // Render Chess Piece directly into a wrapper
    const piece = engine.getPiece(displayR, displayC);
    if (piece && PIECE_SVGS[piece]) {
      const wrap = document.createElement('div');
      wrap.className = 'piece-wrapper';
      wrap.innerHTML = PIECE_SVGS[piece];
      sq.appendChild(wrap);
    }

    // Target Legal Move Indicators (rendered after piece so hint ring/dot is visible)
    if (state.selectedSquare) {
      const isTarget = state.availableMoves.some(m => m.to.r === displayR && m.to.c === displayC);
      if (isTarget) {
        if (piece) {
          const captureRing = document.createElement('div');
          captureRing.className = 'hint-capture';
          sq.appendChild(captureRing);
        } else {
          const dot = document.createElement('div');
          dot.className = 'hint-dot';
          sq.appendChild(dot);
        }
      }
    }
  });

  updatePlayersHUD();
}

// Update Captured Trays, Advantage and Turn Indicator
function updatePlayersHUD() {
  const whiteTray = document.getElementById('tray-white');
  const blackTray = document.getElementById('tray-black');
  whiteTray.innerHTML = '';
  blackTray.innerHTML = '';

  let whiteMat = 0;
  let blackMat = 0;

  const currentPieces = { w: {}, b: {} };
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = engine.board[r][c];
      if (p) {
        const col = p[0];
        const type = p[1].toLowerCase();
        currentPieces[col][type] = (currentPieces[col][type] || 0) + 1;
        if (col === 'w') whiteMat += PIECE_VALS[type] || 0;
        else blackMat += PIECE_VALS[type] || 0;
      }
    }
  }

  const starting = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  ['q', 'r', 'b', 'n', 'p'].forEach(type => {
    // White captured by Black
    const lostWhite = Math.max(0, starting[type] - (currentPieces.w[type] || 0));
    for (let i = 0; i < lostWhite; i++) {
      const icon = document.createElement('span');
      icon.className = 'captured-icon';
      icon.innerHTML = PIECE_SVGS['w' + type.toUpperCase()];
      blackTray.appendChild(icon);
    }

    // Black captured by White
    const lostBlack = Math.max(0, starting[type] - (currentPieces.b[type] || 0));
    for (let i = 0; i < lostBlack; i++) {
      const icon = document.createElement('span');
      icon.className = 'captured-icon';
      icon.innerHTML = PIECE_SVGS['b' + type.toUpperCase()];
      whiteTray.appendChild(icon);
    }
  });

  const diff = whiteMat - blackMat;
  document.getElementById('adv-white').textContent = diff > 0 ? `+${diff}` : '';
  document.getElementById('adv-black').textContent = diff < 0 ? `+${Math.abs(diff)}` : '';

  // Turn pills
  document.getElementById('pill-white').classList.toggle('active', engine.turn === 'w' && !state.isGameOver);
  document.getElementById('pill-black').classList.toggle('active', engine.turn === 'b' && !state.isGameOver);
}

// Append Move Log to Sidebar
function updateMovesLog() {
  movesLogEl.innerHTML = '';
  const hist = engine.history;
  for (let i = 0; i < hist.length; i += 2) {
    const row = document.createElement('div');
    row.className = 'move-row';

    const num = document.createElement('div');
    num.className = 'move-num';
    num.textContent = `${Math.floor(i / 2) + 1}.`;
    row.appendChild(num);

    const whiteMove = document.createElement('div');
    whiteMove.className = `move-col ${i === hist.length - 1 ? 'active' : ''}`;
    whiteMove.textContent = hist[i].san;
    row.appendChild(whiteMove);

    if (hist[i + 1]) {
      const blackMove = document.createElement('div');
      blackMove.className = `move-col ${i + 1 === hist.length - 1 ? 'active' : ''}`;
      blackMove.textContent = hist[i + 1].san;
      row.appendChild(blackMove);
    }

    movesLogEl.appendChild(row);
  }
  movesLogEl.scrollTop = movesLogEl.scrollHeight;
}

// Status Banner Update
function updateStatusBadge(info) {
  if (info && info.isCheckmate) {
    state.isGameOver = true;
    const winner = engine.turn === 'w' ? 'Black' : 'White';
    statusBadge.textContent = `CHECKMATE • ${winner.toUpperCase()} WINS`;
    statusBadge.className = 'status-badge gameover';
    sfx.playEnd();
    return;
  }
  if (info && info.isStalemate) {
    state.isGameOver = true;
    statusBadge.textContent = 'DRAW • STALEMATE';
    statusBadge.className = 'status-badge gameover';
    sfx.playEnd();
    return;
  }
  if (engine.isInCheck(engine.turn)) {
    statusBadge.textContent = `${engine.turn === 'w' ? 'WHITE' : 'BLACK'} IS IN CHECK`;
    statusBadge.className = 'status-badge check';
    return;
  }
  statusBadge.textContent = `${engine.turn === 'w' ? 'WHITE' : 'BLACK'} TO MOVE`;
  statusBadge.className = 'status-badge';
}

// Execute Move
function executeMove(move) {
  state.lastMove = move;
  const isCapture = !!engine.board[move.to.r][move.to.c] || move.isEnPassant;
  const res = engine.makeMove(move);

  state.selectedSquare = null;
  state.availableMoves = [];

  updateMovesLog();
  updateStatusBadge(res);

  if (res.isCheckmate || res.isStalemate) {
    // Sound already played
  } else if (res.isCheck) {
    sfx.playCheck();
  } else if (isCapture) {
    sfx.playCapture();
  } else {
    sfx.playMove();
  }

  renderBoard();

  // AI Turn Trigger
  if (!state.isGameOver && state.mode === 'ai' && engine.turn === 'b') {
    state.isThinking = true;
    statusBadge.textContent = 'BOT IS THINKING...';
    setTimeout(() => {
      const botMove = findBestMove(engine, state.difficulty);
      state.isThinking = false;
      if (botMove) executeMove(botMove);
    }, 250);
  }
}

// Square Click / Tap Handler
function handleSquareSelect(r, c) {
  if (state.isGameOver || state.isThinking) return;
  if (state.mode === 'ai' && engine.turn === 'b') return;

  const clickedPiece = engine.getPiece(r, c);

  // If already selected, check if clicked square is a legal destination
  if (state.selectedSquare) {
    const move = state.availableMoves.find(m => m.to.r === r && m.to.c === c);
    if (move) {
      // Check for pawn promotion
      if (move.promo) {
        showPromotionModal(move.from, move.to);
        return;
      }
      executeMove(move);
      return;
    }
  }

  // Select friendly piece
  if (clickedPiece && clickedPiece[0] === engine.turn) {
    state.selectedSquare = { r, c };
    const allLegal = engine.getLegalMoves(engine.turn);
    state.availableMoves = allLegal.filter(m => m.from.r === r && m.from.c === c);
    renderBoard();
  } else {
    state.selectedSquare = null;
    state.availableMoves = [];
    renderBoard();
  }
}

// Pawn Promotion Picker
function showPromotionModal(from, to) {
  state.pendingPromotion = { from, to };
  promoGrid.innerHTML = '';
  const color = engine.turn;
  ['Q', 'R', 'B', 'N'].forEach(type => {
    const opt = document.createElement('div');
    opt.className = 'promo-option';
    opt.innerHTML = PIECE_SVGS[color + type];
    opt.onclick = () => {
      promoModal.classList.add('hidden');
      executeMove({
        from: state.pendingPromotion.from,
        to: state.pendingPromotion.to,
        promo: type
      });
      state.pendingPromotion = null;
    };
    promoGrid.appendChild(opt);
  });
  promoModal.classList.remove('hidden');
}

// --- TOUCH & MOUSE DRAG AND DROP ---
let draggedSquare = null;
let touchMoved = false;

function setupDragEvents() {
  function getSquareFromCoords(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const sq = el.closest('.square');
    if (!sq) return null;
    return {
      r: parseInt(sq.dataset.boardRow),
      c: parseInt(sq.dataset.boardCol)
    };
  }

  // Pointer Down
  boardEl.addEventListener('pointerdown', (e) => {
    if (state.isGameOver || state.isThinking) return;
    if (state.mode === 'ai' && engine.turn === 'b') return;

    const coords = getSquareFromCoords(e.clientX, e.clientY);
    if (!coords) return;

    touchMoved = false;
    const p = engine.getPiece(coords.r, coords.c);

    // If destination of existing selection, let click handle it
    const isTarget = state.availableMoves.some(m => m.to.r === coords.r && m.to.c === coords.c);
    if (isTarget) return;

    if (p && p[0] === engine.turn) {
      draggedSquare = coords;
      state.selectedSquare = coords;
      const allLegal = engine.getLegalMoves(engine.turn);
      state.availableMoves = allLegal.filter(m => m.from.r === coords.r && m.from.c === coords.c);
      renderBoard();

      // Show ghost
      dragGhost.innerHTML = PIECE_SVGS[p];
      dragGhost.style.left = `${e.clientX}px`;
      dragGhost.style.top = `${e.clientY}px`;
      dragGhost.style.display = 'block';
    }
  });

  // Pointer Move
  window.addEventListener('pointermove', (e) => {
    if (!draggedSquare) return;
    touchMoved = true;
    dragGhost.style.left = `${e.clientX}px`;
    dragGhost.style.top = `${e.clientY}px`;
  });

  // Pointer Up
  window.addEventListener('pointerup', (e) => {
    if (!draggedSquare) return;
    dragGhost.style.display = 'none';

    const target = getSquareFromCoords(e.clientX, e.clientY);
    if (target && touchMoved) {
      const move = state.availableMoves.find(m => m.to.r === target.r && m.to.c === target.c);
      if (move) {
        draggedSquare = null;
        if (move.promo) {
          showPromotionModal(move.from, move.to);
        } else {
          executeMove(move);
        }
        return;
      }
    }

    // If just a tap without movement
    if (!touchMoved && draggedSquare) {
      handleSquareSelect(draggedSquare.r, draggedSquare.c);
    }
    draggedSquare = null;
  });
}

// Click listener fallback for tap-to-move
boardEl.addEventListener('click', (e) => {
  const sq = e.target.closest('.square');
  if (!sq) return;
  const r = parseInt(sq.dataset.boardRow);
  const c = parseInt(sq.dataset.boardCol);
  handleSquareSelect(r, c);
});

// --- NEW GAME & BUTTON ACTIONS ---
function startNewGame() {
  engine.reset();
  state.selectedSquare = null;
  state.availableMoves = [];
  state.lastMove = null;
  state.isGameOver = false;
  state.isThinking = false;

  promoModal.classList.add('hidden');
  updateStatusBadge();
  updateMovesLog();
  renderBoard();
}

function initUIBindings() {
  document.getElementById('btn-new-game').onclick = startNewGame;

  document.getElementById('btn-undo').onclick = () => {
    if (state.isThinking) return;
    // In vs Bot mode, undo 2 plies (bot move and player move)
    if (state.mode === 'ai' && engine.turn === 'w' && engine.history.length >= 2) {
      engine.undo();
      engine.undo();
    } else {
      engine.undo();
    }
    state.lastMove = engine.history.length > 0 ? engine.history[engine.history.length - 1].move : null;
    state.selectedSquare = null;
    state.availableMoves = [];
    state.isGameOver = false;
    updateMovesLog();
    updateStatusBadge();
    renderBoard();
  };

  document.getElementById('btn-flip').onclick = () => {
    state.flipped = !state.flipped;
    renderBoard();
  };

  const soundBtn = document.getElementById('btn-sound');
  soundBtn.onclick = () => {
    sfx.muted = !sfx.muted;
    soundBtn.textContent = sfx.muted ? '🔇' : '🔊';
  };

  // Mode Selection
  const modeSelect = document.getElementById('mode-select');
  modeSelect.onchange = (e) => {
    state.mode = e.target.value;
    const nameBlack = document.getElementById('name-black');
    const avatarBlack = document.getElementById('avatar-black');
    if (state.mode === 'ai') {
      nameBlack.textContent = 'StockBot';
      avatarBlack.textContent = '🤖';
    } else {
      nameBlack.textContent = 'Player (Black)';
      avatarBlack.textContent = '👤';
    }
    startNewGame();
  };

  // Difficulty Selection
  const diffSelect = document.getElementById('difficulty-select');
  diffSelect.onchange = (e) => {
    state.difficulty = e.target.value;
  };
}

// Bootstrap
window.addEventListener('DOMContentLoaded', () => {
  buildBoardGrid();
  setupDragEvents();
  initUIBindings();
  startNewGame();
});
</script>
